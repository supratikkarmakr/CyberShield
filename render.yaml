services:
  - type: web
    name: cybershield
    runtime: python
    pythonVersion: "3.12.0"
    buildCommand: bash build.sh
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
